name: CI/CD O'RDV Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      # Variables d'environnement pour les tests — valeurs fictives (Prisma est mocké)
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_key' }}
      DATABASE_URL: mysql://test:test@localhost:3306/ordv_test
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd backend && npm install
      - name: Run tests with coverage
        run: cd backend && npm run test:coverage
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30

  build-frontend:
    runs-on: ubuntu-latest
    env:
      REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://o-rdv-production.up.railway.app/api' }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd frontend && npm install --legacy-peer-deps
      - name: Run tests with coverage
        run: cd frontend && npm run test:coverage
        env:
          CI: false
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30
      - name: Build
        run: cd frontend && npm run build
        env:
          CI: false
