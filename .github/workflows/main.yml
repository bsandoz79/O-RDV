name: CI/CD O'RDV Pipeline

# Déclenchement du pipeline à chaque push ou pull request sur la branche principale
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job pour le Backend (Node.js + Express)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd backend && npm install
      - name: Run Lint
        run: cd backend && npm run lint --if-present
      - name: Build Backend
        run: cd backend && npm run build --if-present

  # Job pour le Frontend (React.js SPA)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Run Tests
        run: cd frontend && npm test --if-present
      - name: Build Frontend (React SPA)
        run: cd frontend && npm run build